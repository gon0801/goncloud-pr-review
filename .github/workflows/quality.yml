name: Quality

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run pre-commit (gitleaks)
        uses: pre-commit/action@v3.0.1

  gate:
    runs-on: ubuntu-latest
    if: always()
    needs: [quality]
    timeout-minutes: 5
    steps:
      - name: Todos los jobs de calidad en verde
        env:
          R_QUALITY: ${{ needs.quality.result }}
        run: |
          [ "$R_QUALITY" = "success" ] || { echo "gate: quality=$R_QUALITY" >&2; exit 1; }
          echo "gate: OK"
