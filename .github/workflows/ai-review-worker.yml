name: ai-review-worker
on:
  workflow_dispatch:
    inputs:
      request_id:
        description: ID de la solicitud persistida
        required: true
        type: string
      pr_number:
        description: PR de la solicitud
        required: true
        type: string
      head_sha:
        description: HEAD del PR a revisar (datos, no código del worker)
        required: true
        type: string
      base_sha:
        description: BASE del PR a revisar (datos, no código del worker)
        required: true
        type: string
      coordinator_run_id:
        description: Run del coordinador que despachó
        required: true
        type: string
      finding_identity:
        description: Identidad de hallazgos del coordinador (current o anchors)
        required: false
        default: current
        type: string

permissions:
  contents: read
  pull-requests: read

# La recuperación la decide el coordinador re-autorizando, no este grupo.
concurrency:
  group: ai-review-worker-${{ github.repository }}-${{ inputs.request_id }}
  cancel-in-progress: false

# El display_title de este run es la entrada del resultado en el grupo del PR.
run-name: ${{ inputs.pr_number }}

jobs:
  execute:
    runs-on: ubuntu-latest
    # El worker parsea con la misma identidad que usa el coordinador al aceptar.
    env:
      FINDING_IDENTITY: ${{ inputs.finding_identity }}
    steps:
      - name: checkout del código confiable del worker
        uses: actions/checkout@v4
        with:
          # Historia completa: con profundidad 1 la base del PR queda como raíz
          # superficial y git merge-base falla en cuanto main avanza tras el fork.
          fetch-depth: 0
          persist-credentials: false
      - name: checkout del CLI confiable del repo central
        uses: actions/checkout@v4
        with:
          repository: gon0801/goncloud-pr-review
          ref: 9fa765de5a312d4adfb6512cc9cc41df3137a5f7
          path: ai-review-code
          persist-credentials: false
      - name: validar entradas
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_SHA: ${{ inputs.head_sha }}
          BASE_SHA: ${{ inputs.base_sha }}
        run: |
          for valor in "$REQUEST_ID" "$PR_NUMBER"; do
            [[ "$valor" =~ ^[0-9]+$ ]] || { echo "ai-review: entrada numérica inválida" >&2; exit 1; }
          done
          for sha in "$HEAD_SHA" "$BASE_SHA"; do
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "ai-review: SHA inválido" >&2; exit 1; }
          done
          [[ "$FINDING_IDENTITY" =~ ^(current|anchors)$ ]] || { echo "ai-review: identidad de hallazgos inválida" >&2; exit 1; }
      - name: traer el PR como datos
        env:
          HEAD_SHA: ${{ inputs.head_sha }}
          BASE_SHA: ${{ inputs.base_sha }}
        run: |
          git fetch --no-tags origin "+${HEAD_SHA}:refs/ai-review/head"
          git fetch --no-tags origin "${BASE_SHA}"
          git worktree add --detach pr refs/ai-review/head
      # En pr: el plan de la solicitud lee HEAD_SHA y BASE_SHA con git. El código
      # que corre sigue siendo el del checkout confiable ($GITHUB_WORKSPACE).
      - name: preparar solicitud y paquete
        working-directory: pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_SHA: ${{ inputs.head_sha }}
          BASE_SHA: ${{ inputs.base_sha }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          mkdir -p "${RUNNER_TEMP}/ai-review"
          python "$GITHUB_WORKSPACE/ai-review-code/review.py" execute-request \
            --request-id "$REQUEST_ID" \
            --work "${RUNNER_TEMP}/ai-review"
      - name: preparar contexto
        working-directory: pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_SHA: ${{ inputs.head_sha }}
          BASE_SHA: ${{ inputs.base_sha }}
          MAX_DIFF_BYTES: "1500000"
        run: python "$GITHUB_WORKSPACE/ai-review-code/review.py" prepare --work "${RUNNER_TEMP}/ai-review"
      - name: versión de Python para la caché de instalación
        id: py
        run: echo "version=$(python -c 'import sys; print(f"{sys.version_info[0]}.{sys.version_info[1]}")')" >> "$GITHUB_OUTPUT"
      - name: caché de instalación (Claude Code y LiteLLM)
        uses: actions/cache@v4
        with:
          path: ~/.cache/ai-review
          key: ai-review-install-${{ runner.os }}-py${{ steps.py.outputs.version }}-claude-2.1.282-litellm-1.102.1
      - name: instalar Claude Code (y LiteLLM para opencode-go)
        env:
          PROVIDER: opencode-go
          FALLBACK_ENABLED: ${{ secrets.DEEPSEEK_API_KEY != '' }}
        run: python "$GITHUB_WORKSPACE/ai-review-code/review.py" install --work "${RUNNER_TEMP}/ai-review"
      - name: modelo
        working-directory: pr
        env:
          API_KEY: ${{ secrets.AI_REVIEW_API_KEY }}
          FALLBACK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PROVIDER: opencode-go
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: python "$GITHUB_WORKSPACE/ai-review-code/review.py" run --work "${RUNNER_TEMP}/ai-review"
      - name: cerrar el resultado para el coordinador
        id: cerrar
        env:
          API_KEY: ${{ secrets.AI_REVIEW_API_KEY }}
          FALLBACK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PROVIDER: opencode-go
        run: python "$GITHUB_WORKSPACE/ai-review-code/review.py" close-result --work "${RUNNER_TEMP}/ai-review"
      - name: subir resultado como datos
        uses: actions/upload-artifact@v4
        with:
          name: ai-review-result-request-${{ inputs.request_id }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: "${{ runner.temp }}/ai-review"
          retention-days: 7

  # Un run despachado con GITHUB_TOKEN no dispara workflow_run al terminar, así
  # que el worker avisa al publicador con workflow_dispatch. Job aparte para que
  # el paso que corre el modelo no tenga actions: write.
  avisar:
    needs: execute
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: avisar al publicador
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
          WORKER_RUN_ID: ${{ github.run_id }}
          WORKER_ATTEMPT: ${{ github.run_attempt }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] || { echo "ai-review: número de PR inválido" >&2; exit 1; }
          gh workflow run ai-review-publish.yml --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH" \
            -f pr_number="$PR_NUMBER" -f worker_run_id="$WORKER_RUN_ID" -f worker_attempt="$WORKER_ATTEMPT"
