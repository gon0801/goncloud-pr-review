# Revisión automática de PRs con IA (repo central: gon0801/goncloud-pr-review).
# Desactivar sin tocar código: gh variable set AI_REVIEW_DISABLED --body true
name: AI review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      !github.event.pull_request.draft
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Skip everything (including checkout) when disabled, so a failed checkout
      # can never turn the disabled check red. Case-insensitive, like the action.
      - name: Check disabled
        id: check
        env:
          DISABLED: ${{ vars.AI_REVIEW_DISABLED }}
        run: |
          if [ "${DISABLED,,}" = "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.check.outputs.skip != 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./
        if: steps.check.outputs.skip != 'true'
        with:
          api_key: ${{ secrets.AI_REVIEW_API_KEY }}
          disabled: ${{ vars.AI_REVIEW_DISABLED }}
