name: ai-review-publish
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR a recuperar
        required: true
        type: string
      worker_run_id:
        description: Run del worker que avisa (vacío = recuperación)
        required: false
        default: ""
        type: string
      worker_attempt:
        description: Attempt del run del worker
        required: false
        default: "1"
        type: string

permissions:
  contents: read
  pull-requests: write
  actions: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    # Un solo escritor por repositorio y PR: los tres eventos resuelven el
    # mismo grupo y nunca se cancela al escritor activo. Va en el job y no en
    # el workflow para que un run que el `if:` descarta no entre al grupo ni
    # reemplace al run pendiente de otro evento: cada run converge el PR
    # completo, así que basta con que el último pendiente corra.
    concurrency:
      group: ai-review-${{ github.repository }}-${{ github.event.pull_request.number || github.event.issue.number || github.event.inputs.pr_number }}
      cancel-in-progress: false
    # El coordinador corre código confiable: nunca un push de fork ni de un
    # borrador. Un comentario solo cuenta en un PR y si nombra el comando: el
    # script lo acepta tras espacios, y uno filtrado aquí se aplicaría tarde.
    if: >-
      (github.event_name != 'pull_request_target' || (!github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository))
      && (github.event_name != 'issue_comment' || (github.event.issue.pull_request && contains(github.event.comment.body, 'ai-review:')))
    steps:
      - name: checkout del código confiable
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: checkout del CLI confiable del repo central
        uses: actions/checkout@v4
        with:
          repository: gon0801/goncloud-pr-review
          ref: 0f2d9cb09ae64f335d1f8d39516150f4fbcfae71
          path: ai-review-code
          persist-credentials: false
      - name: preparar entorno
        env:
          EV_PR: ${{ github.event.pull_request.number || github.event.issue.number || github.event.inputs.pr_number }}
          EV_HEAD: ${{ github.event.pull_request.head.sha }}
          EV_BASE: ${{ github.event.pull_request.base.sha }}
          EV_PATH: ${{ github.event_path }}
          EV_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ ! "$EV_PR" =~ ^[0-9]+$ ]]; then
            echo "ai-review: número de PR inválido" >&2
            exit 1
          fi
          for sha in "$EV_HEAD" "$EV_BASE"; do
            if [[ -n "$sha" && ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "ai-review: SHA inválido" >&2
              exit 1
            fi
          done
          if [[ -z "$EV_DEFAULT_BRANCH" || "$EV_DEFAULT_BRANCH" == *$'\n'* || "$EV_DEFAULT_BRANCH" == *$'\r'* ]]; then
            echo "ai-review: rama por defecto inválida" >&2
            exit 1
          fi
          {
            printf 'REPO=%s\n' "$GITHUB_REPOSITORY"
            printf 'PR_NUMBER=%s\n' "$EV_PR"
            printf 'HEAD_SHA=%s\n' "$EV_HEAD"
            printf 'BASE_SHA=%s\n' "$EV_BASE"
            printf 'GITHUB_EVENT_PATH=%s\n' "$EV_PATH"
            printf 'BOT_LOGIN=%s\n' "github-actions[bot]"
            printf 'WORKER_REF=%s\n' "$EV_DEFAULT_BRANCH"
          } >> "${GITHUB_ENV}"
          mkdir -p "${RUNNER_TEMP}/ai-review"
      # El script cosecha los resultados del worker (gh run download, que lee
      # GH_TOKEN): un aviso perdido lo recoge el siguiente evento.
      - name: reconciliar (comandos, resultados, admisión)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKER_RUN_ID: ${{ inputs.worker_run_id }}
          WORKER_ATTEMPT: ${{ inputs.worker_attempt }}
        run: |
          python "$GITHUB_WORKSPACE/ai-review-code/review.py" reconcile --work "${RUNNER_TEMP}/ai-review"
