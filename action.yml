name: AI PR review
description: Repo-aware PR review with Claude Code on DeepSeek V4.1 Flash (via OpenCode Go or the DeepSeek API). One sticky comment per PR, deduplicated by head SHA.

inputs:
  api_key:
    description: Key for the model endpoint (pass secrets.AI_REVIEW_API_KEY)
    required: true
  disabled:
    description: Set to "true" to turn the review off without failing the check (pass vars.AI_REVIEW_DISABLED)
    default: ""
  provider:
    description: Where DeepSeek V4.1 Flash is served from, opencode-go or deepseek. The model itself is fixed.
    default: opencode-go
  language:
    description: Language of the review text
    default: es
  exclude:
    description: Extra newline-separated path globs to skip, on top of the built-in lock/generated/binary filters
    default: ""
  max_turns:
    description: Agent turn cap per attempt, or "auto" to scale it with the diff size (25/40/60)
    default: "auto"
  max_diff_bytes:
    description: Diff size budget; lower-priority files beyond it are listed as not reviewed
    default: "1500000"
  github_token:
    description: Token used to read and write the PR comment
    default: ${{ github.token }}
  bot_login:
    description: Login that github_token posts as; only its comments count as the sticky review
    default: github-actions[bot]

runs:
  using: composite
  steps:
    - name: Check inputs
      id: check
      shell: bash
      env:
        EVENT: ${{ github.event_name }}
        DISABLED: ${{ inputs.disabled }}
      run: |
        if [ "$EVENT" != "pull_request" ]; then
          echo "::error::ai-review solo corre en eventos pull_request (llegó $EVENT)"; exit 1
        fi
        if [ "${DISABLED,,}" = "true" ]; then
          echo "::notice::ai-review desactivado (AI_REVIEW_DISABLED)"
          echo "skip=true" >> "$GITHUB_OUTPUT"
        else
          echo "skip=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Skip if this commit was already reviewed
      id: gate
      if: steps.check.outputs.skip != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        RUN_ATTEMPT: ${{ github.run_attempt }}
        BOT_LOGIN: ${{ inputs.bot_login }}
      run: python3 "$GITHUB_ACTION_PATH/review.py" gate

    - name: Prepare diff and context
      if: steps.check.outputs.skip != 'true' && steps.gate.outputs.skip != 'true'
      shell: bash
      env:
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        EXTRA_EXCLUDES: ${{ inputs.exclude }}
        MAX_DIFF_BYTES: ${{ inputs.max_diff_bytes }}
      run: |
        git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null || git fetch --no-tags --quiet origin "$BASE_SHA"
        python3 "$GITHUB_ACTION_PATH/review.py" prepare

    - name: Cache install (npm cache for Claude Code, venv for LiteLLM)
      if: steps.check.outputs.skip != 'true' && steps.gate.outputs.skip != 'true'
      uses: actions/cache@v4
      with:
        path: |
          ~/.npm
          ~/.cache/ai-review
        # Must match CLAUDE_CODE_VERSION and LITELLM_VERSION in review.py (covered by test).
        key: ai-review-install-claude-2.1.282-litellm-1.102.1

    - name: Install Claude Code (and LiteLLM for opencode-go)
      if: steps.check.outputs.skip != 'true' && steps.gate.outputs.skip != 'true'
      shell: bash
      env:
        PROVIDER: ${{ inputs.provider }}
      run: python3 "$GITHUB_ACTION_PATH/review.py" install

    - name: Review
      if: steps.check.outputs.skip != 'true' && steps.gate.outputs.skip != 'true'
      shell: bash
      env:
        API_KEY: ${{ inputs.api_key }}
        PROVIDER: ${{ inputs.provider }}
        LANGUAGE: ${{ inputs.language }}
        MAX_TURNS: ${{ inputs.max_turns }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: python3 "$GITHUB_ACTION_PATH/review.py" run

    - name: Publish sticky comment
      if: steps.check.outputs.skip != 'true' && steps.gate.outputs.skip != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        API_KEY: ${{ inputs.api_key }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        PROVIDER: ${{ inputs.provider }}
        BOT_LOGIN: ${{ inputs.bot_login }}
      run: python3 "$GITHUB_ACTION_PATH/review.py" publish
