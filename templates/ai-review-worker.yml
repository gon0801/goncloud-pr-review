name: ai-review-worker
on:
  workflow_dispatch:
    inputs:
      request_id:
        description: ID de la solicitud persistida
        required: true
        type: string
      pr_number:
        description: PR de la solicitud
        required: true
        type: string
      head_sha:
        description: HEAD del PR a revisar (datos, no código del worker)
        required: true
        type: string
      coordinator_run_id:
        description: Run del coordinador que despachó
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

# La recuperación la decide el coordinador re-autorizando, no este grupo.
concurrency:
  group: ai-review-worker-${{ github.repository }}-${{ inputs.request_id }}
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - name: checkout del código confiable del worker
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: preparar solicitud y paquete
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          mkdir -p "${RUNNER_TEMP}/ai-review"
          python review.py execute-request \
            --request-id "${{ inputs.request_id }}" \
            --work "${RUNNER_TEMP}/ai-review"
      - name: traer el PR como datos
        run: |
          git fetch --no-tags origin "+${{ inputs.head_sha }}:refs/ai-review/head"
      - name: modelo
        env:
          API_KEY: ${{ secrets.API_KEY }}
          FALLBACK_API_KEY: ${{ secrets.FALLBACK_API_KEY }}
        run: |
          echo "ejecución del modelo para la solicitud ${{ inputs.request_id }}"
      - name: subir resultado como datos
        uses: actions/upload-artifact@v4
        with:
          name: ai-review-result-request-${{ inputs.request_id }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: "${RUNNER_TEMP}/ai-review"
          retention-days: 7
