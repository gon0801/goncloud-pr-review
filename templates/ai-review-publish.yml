name: ai-review-publish
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  workflow_run:
    workflows: [ai-review-worker]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR a recuperar
        required: true
        type: string
      worker_run_id:
        description: Run del worker cuyo resultado se publica (vacío = recuperación)
        required: false
        default: ""
        type: string
      worker_attempt:
        description: Attempt del run del worker
        required: false
        default: ""
        type: string

# Un solo escritor por repositorio y PR: los cuatro eventos resuelven el
# mismo grupo y nunca se cancela al escritor activo.
permissions:
  contents: read
  pull-requests: write
  actions: write

concurrency:
  group: ai-review-${{ github.repository }}-${{ github.event.pull_request.number || github.event.issue.number || github.event.inputs.pr_number || github.event.workflow_run.display_title }}
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    # El coordinador corre código confiable: un workflow_run sólo se atiende
    # si es un dispatch nuestro sobre el propio repo (anti pwn-request).
    if: >-
      (github.event_name != 'pull_request_target' || (!github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository))
      && (github.event_name != 'workflow_run' || (github.event.workflow_run.event == 'workflow_dispatch' && github.event.workflow_run.head_repository.full_name == github.repository))
    steps:
      - name: checkout del código confiable
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: preparar entorno
        env:
          EV_PR: ${{ github.event.pull_request.number || github.event.issue.number || github.event.inputs.pr_number || github.event.workflow_run.display_title }}
          EV_HEAD: ${{ github.event.pull_request.head.sha }}
          EV_BASE: ${{ github.event.pull_request.base.sha }}
          EV_PATH: ${{ github.event_path }}
          EV_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ ! "$EV_PR" =~ ^[0-9]+$ ]]; then
            echo "ai-review: número de PR inválido" >&2
            exit 1
          fi
          for sha in "$EV_HEAD" "$EV_BASE"; do
            if [[ -n "$sha" && ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "ai-review: SHA inválido" >&2
              exit 1
            fi
          done
          if [[ -z "$EV_DEFAULT_BRANCH" || "$EV_DEFAULT_BRANCH" == *$'\n'* || "$EV_DEFAULT_BRANCH" == *$'\r'* ]]; then
            echo "ai-review: rama por defecto inválida" >&2
            exit 1
          fi
          {
            printf 'REPO=%s\n' "$GITHUB_REPOSITORY"
            printf 'PR_NUMBER=%s\n' "$EV_PR"
            printf 'HEAD_SHA=%s\n' "$EV_HEAD"
            printf 'BASE_SHA=%s\n' "$EV_BASE"
            printf 'GITHUB_EVENT_PATH=%s\n' "$EV_PATH"
            printf 'BOT_LOGIN=%s\n' "github-actions[bot]"
            printf 'WORKER_REF=%s\n' "$EV_DEFAULT_BRANCH"
          } >> "${GITHUB_ENV}"
          mkdir -p "${RUNNER_TEMP}/ai-review"
      # Un run despachado con GITHUB_TOKEN no dispara workflow_run al terminar:
      # el worker avisa con workflow_dispatch (worker_run_id), que sí se permite.
      - name: bajar el resultado del worker
        if: github.event_name == 'workflow_run' || (github.event_name == 'workflow_dispatch' && inputs.worker_run_id != '')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKER_RUN_ID: ${{ github.event.workflow_run.id || inputs.worker_run_id }}
          WORKER_ATTEMPT: ${{ github.event.workflow_run.run_attempt || inputs.worker_attempt }}
        run: |
          for valor in "$WORKER_RUN_ID" "$WORKER_ATTEMPT"; do
            [[ "$valor" =~ ^[0-9]+$ ]] || { echo "ai-review: run o attempt del worker inválido" >&2; exit 1; }
          done
          gh run download "$WORKER_RUN_ID" --repo "$GITHUB_REPOSITORY" --dir "${RUNNER_TEMP}/ai-review/descarga"
          encontrados=$(find "${RUNNER_TEMP}/ai-review/descarga" -path "*attempt-${WORKER_ATTEMPT}*" -name result.json)
          total=$(printf '%s' "$encontrados" | grep -c .)
          if [ "$total" -ne 1 ]; then
            echo "ai-review: se esperaba un result.json del attempt ${WORKER_ATTEMPT}, hubo ${total}" >&2
            exit 1
          fi
          cp "$encontrados" "${RUNNER_TEMP}/ai-review/result.json"
      - name: reconciliar (admitir, comandos, resultados, recuperar)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKER_RUN_ID: ${{ inputs.worker_run_id }}
          WORKER_ATTEMPT: ${{ inputs.worker_attempt }}
        run: |
          python review.py reconcile --work "${RUNNER_TEMP}/ai-review"
