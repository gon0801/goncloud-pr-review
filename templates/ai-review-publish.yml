name: ai-review-publish
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  workflow_run:
    workflows: [ai-review-worker]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR a recuperar
        required: true
        type: string

# Un solo escritor por repositorio y PR: los cuatro eventos resuelven el
# mismo grupo y nunca se cancela al escritor activo.
permissions:
  contents: read
  pull-requests: write
  actions: write

concurrency:
  group: ai-review-${{ github.repository }}-${{ github.event.pull_request.number || github.event.issue.number || github.event.inputs.pr_number || github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: checkout del código confiable
        uses: actions/checkout@v4
        with:
          # pull_request_target y workflow_dispatch corren código de la base;
          # workflow_run corre el ref del propio run del worker
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: preparar entorno
        run: |
          {
            echo "REPO=${{ github.repository }}"
            echo "PR_NUMBER=${{ github.event.pull_request.number || github.event.issue.number || github.event.inputs.pr_number || github.event.workflow_run.pull_requests[0].number }}"
            echo "HEAD_SHA=${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || github.sha }}"
            echo "BASE_SHA=${{ github.event.pull_request.base.sha }}"
            echo "GITHUB_EVENT_PATH=${{ github.event_path }}"
            echo "BOT_LOGIN=github-actions[bot]"
            echo "WORKER_REF=${{ github.event.repository.default_branch }}"
          } >> "${GITHUB_ENV}"
          mkdir -p "${RUNNER_TEMP}/ai-review"
      - name: bajar el resultado del worker
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKER_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          gh run download "$WORKER_RUN_ID" --repo "${{ github.repository }}"             --dir "${RUNNER_TEMP}/ai-review"
      - name: reconciliar (admitir, comandos, resultados, recuperar)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python review.py reconcile --work "${RUNNER_TEMP}/ai-review"
